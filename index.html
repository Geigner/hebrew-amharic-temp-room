<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>גשר שפות: עברית-אמהרית | היחידה לקידום נוער נוף הגליל</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap');
    body { font-family: 'Assistant', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md p-3 sm:p-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <h1 class="text-base sm:text-xl font-bold">גשר שפות: עברית ⇄ אמהרית</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="clearChatPrompt()" class="bg-indigo-800 hover:bg-indigo-900 text-xs px-3 py-1.5 rounded transition">
        איפוס חדר
      </button>
    </div>
  </header>

  <!-- Chat Box -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-2 sm:p-4 flex flex-col gap-3 overflow-hidden">
    <div id="chat-box" class="bg-white border border-slate-200 rounded-xl shadow-inner flex-1 p-3 sm:p-4 overflow-y-auto flex flex-col gap-3">
      <div id="loading-msg" class="text-center text-slate-400 py-10">טוען היסטוריית שיחה...</div>
    </div>

    <!-- Input Area -->
    <div class="bg-white border border-slate-200 rounded-xl shadow p-3 flex flex-col gap-2">
      <div class="flex gap-2">
        <textarea id="message-input" rows="2" placeholder="הקלד בעברית או באמהרית והתרגום יתבצע אוטומטית (לחץ Enter)..." class="flex-1 border border-slate-300 rounded-lg p-2.5 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none" onkeydown="handleKeyPress(event)"></textarea>
        <button onclick="sendMessage()" id="send-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 rounded-lg font-medium transition shadow text-sm sm:text-base flex items-center justify-center">
          שליחה
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-2.5 text-center text-xs text-slate-500 leading-relaxed">
    היחידה לקידום נוער נוף הגליל | תוכנית היל"ה<br>
    © תשפ"ז | גיא אייגנר – מנהל השכלה | פיתוח וניהול פדגוגי
  </footer>

  <script>
    // הדבק כאן את כתובת ה-Exec המעודכנת שלך מ-Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbwBQoupgTQT9R9ECmzqVZU9ceNT3CarEpXPCpXYFX9wqLKUp8YLbUN8QzSsv2UiNFX8gQ/exec";

    let localHistory = [];
    let isSending = false;

    async function callApi(action, payload = {}) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action, ...payload })
        });
        const resJson = await response.json();
        if (resJson.status === 'success') {
          return resJson.data;
        } else {
          throw new Error(resJson.message || "שגיאת שרת");
        }
      } catch (err) {
        console.error("API Error:", err);
        throw err;
      }
    }

    async function fetchHistory(isBackground = false) {
      if (isSending) return; // לא מושך ברקע בזמן שליחה כדי למנוע דריסה
      try {
        const history = await callApi('getHistory');
        if (JSON.stringify(history) !== JSON.stringify(localHistory)) {
          localHistory = history || [];
          renderChat();
        }
      } catch (err) {
        console.error("שגיאת סנכרון", err);
      }
    }

    function renderChat() {
      const chatBox = document.getElementById('chat-box');
      if (!localHistory || localHistory.length === 0) {
        chatBox.innerHTML = `<div class="text-center text-slate-400 py-10">השיחה ריקה כרגע. התחל לכתוב למטה!</div>`;
        return;
      }

      let html = '';
      localHistory.forEach(item => {
        html += `
          <div class="flex flex-col items-start gap-1 bg-slate-50 border border-slate-200 rounded-xl p-3 shadow-sm">
            <div class="text-xs text-indigo-700 font-bold">${item.sender || 'מערכת גשר שפות'} <span class="text-[10px] text-slate-400 font-normal">(${item.time || ''})</span></div>
            <div class="text-sm sm:text-base text-slate-900 font-medium">${escapeHtml(item.original)}</div>
            <div class="border-t border-slate-200 pt-1.5 text-sm sm:text-base text-indigo-900 font-semibold" dir="auto">
              ${escapeHtml(item.translated)}
            </div>
          </div>
        `;
      });

      const isAtBottom = chatBox.scrollHeight - chatBox.scrollTop <= chatBox.clientHeight + 100;
      chatBox.innerHTML = html;
      if (isAtBottom || !chatBox.dataset.scrolled) {
        chatBox.scrollTop = chatBox.scrollHeight;
        chatBox.dataset.scrolled = "true";
      }
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || isSending) return;

      isSending = true;
      input.value = '';
      document.getElementById('send-btn').disabled = true;

      // עדכון אופטימיסטי מיידי במסך
      const tempItem = {
        original: text,
        translated: "מעבד תרגום...",
        time: "עכשיו",
        sender: "משתמש מקומי"
      };
      localHistory.push(tempItem);
      renderChat();

      try {
        const newHistory = await callApi('sendMessage', { text, sourceLang: 'auto' });
        localHistory = newHistory || [];
        renderChat();
      } catch (err) {
        alert("שגיאה בשליחת הודעה: " + err.message);
        fetchHistory();
      } finally {
        isSending = false;
        document.getElementById('send-btn').disabled = false;
        input.focus();
      }
    }

    async function clearChatPrompt() {
      const pwd = prompt("הכנס סיסמת מנהל לאיפוס השיחה:");
      if (!pwd) return;
      try {
        const history = await callApi('clearChat', { password: pwd });
        localHistory = history || [];
        renderChat();
        alert("השיחה אופסה בהצלחה.");
      } catch (err) {
        alert("שגיאה באיפוס: " + err.message);
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // טעינה ראשונית וסנכרון שקט כל 3 שניות
    fetchHistory();
    setInterval(() => fetchHistory(true), 3000);
  </script>
</body>
</html>
