<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>גשר שפות עברית אמהרית – ניהול חדרים</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 10px;
      background-color: #f0f4f8;
      color: #2d3748;
    }
    .container {
      max-width: 750px;
      margin: 0 auto;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      height: 90vh;
    }
    .header-title {
      background-color: #1B365D;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }
    .admin-controls {
      display: flex;
      gap: 5px;
    }
    .btn-admin {
      background-color: #4a5568;
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-new-room, .btn-reset {
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      display: none;
    }
    .btn-new-room { background-color: #27ae60; }
    .btn-reset { background-color: #e74c3c; }

    /* פאנל ניהול חדרים מרכזי */
    .admin-panel {
      background: #edf2f7;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: none;
      font-size: 13px;
    }
    .admin-panel h3 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #1B365D;
    }
    .rooms-list {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .room-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }
    .room-item a {
      color: #1B365D;
      text-decoration: none;
      font-weight: 600;
    }
    .room-item a:hover { text-decoration: underline; }
    .btn-del-room {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }

    .chat-stream {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      background: #f8fafc;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .status-msg {
      text-align: center;
      color: #4a5568; 
      font-size: 12px;
      margin-top: 20px;
    }

    .message-bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .bubble-user-1 { align-self: flex-start; background-color: #e3f2fd; border-right: 4px solid #1B365D; }
    .bubble-user-2 { align-self: flex-end; background-color: #fff9c4; border-left: 4px solid #fbc02d; }
    .bubble-user-3 { align-self: flex-start; background-color: #e8f5e9; border-right: 4px solid #2e7d32; }
    .bubble-user-other { align-self: flex-end; background-color: #fce4ec; border-left: 4px solid #c2185b; }

    .original-text { font-weight: 600; margin-bottom: 4px; }
    .translated-text { color: #4a5568; font-size: 13px; border-top: 1px dashed #cbd5e1; padding-top: 4px; margin-top: 4px; }
    .msg-time { 
      font-size: 10px; 
      color: #55606e; 
      text-align: left; 
      margin-top: 2px; 
      font-weight: 500;
    }
    
    .input-section {
      background: #fff;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lang-selector {
      font-size: 13px;
      font-weight: bold;
      color: #1B365D;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .lang-selector label { cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .input-row { display: flex; gap: 8px; }
    textarea {
      flex: 1;
      height: 50px;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      box-sizing: border-box;
    }
    textarea:focus { border-color: #1B365D; outline: none; }
    .btn-send {
      background-color: #1B365D;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    .btn-send:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
    footer {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #4a5568;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="header-title">
      <span id="roomTitle">🗣️ גשר שפות עברית אמהרית – חדר שיחה רגעי</span>
      <div class="admin-controls">
        <button id="adminBtn" class="btn-admin">🔐 מנהל</button>
        <button id="newRoomBtn" class="btn-new-room">🔗 צור קישור לשיחה חדשה</button>
        <button id="resetBtn" class="btn-reset">🗑️ נקה חדר נוכחי</button>
      </div>
    </div>

    <!-- פאנל ניהול המרכז את כל החדרים הפעילים -->
    <div id="adminPanel" class="admin-panel">
      <h3>📂 ניהול חדרים פעילים במערכת</h3>
      <div id="activeRoomsList" class="rooms-list">
        <div style="text-align: center; color: #718096; font-size: 12px;">טוען חדרים...</div>
      </div>
    </div>

    <div id="chatStream" class="chat-stream">
      <div class="status-msg">
        מתחבר ל-Firebase...
      </div>
    </div>

    <div class="input-section">
      <div class="input-controls">
        <div class="lang-selector">
          <span>שפת ההקלדה שלי:</span>
          <label><input type="radio" name="chatLang" value="he" checked> 🇮🇱 עברית</label>
          <label><input type="radio" name="chatLang" value="am"> 🇪🇹 አማርኛ</label>
        </div>
      </div>
      <div class="input-row">
        <textarea id="mainInput" placeholder="הקלד משפט בעברית..." dir="rtl"></textarea>
        <button id="sendBtn" class="btn-send">שלח 🚀</button>
      </div>
    </div>

    <footer>
      <div><strong>היחידה לקידום נוער נוף הגליל</strong> | תוכנית היל"ה</div>
      <div>© תשפ"ז | גיא אייגנר – מנהל השכלה | פיתוח וניהול פדגוגי</div>
    </footer>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      getDocs, 
      deleteDoc, 
      doc, 
      setDoc,
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBLjqBXkP8KVHPQzYXczeRvw09qT01-ySE",
      authDomain: "hebrew-amharic-71f5d.firebaseapp.com",
      projectId: "hebrew-amharic-71f5d",
      storageBucket: "hebrew-amharic-71f5d.firebasestorage.app",
      messagingSenderId: "701170625071",
      appId: "1:701170625071:web:8f3e6c9584cb7a823ff4da"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    let currentRoom = urlParams.get('room') || 'general_room';
    
    if (currentRoom !== 'general_room') {
      document.getElementById('roomTitle').innerText = '🗣️ חדר שיחה: ' + currentRoom;
    }

    let clientId = localStorage.getItem('hila_client_id');
    if (!clientId) {
      clientId = 'client_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('hila_client_id', clientId);
    }

    let clientColorMap = {};
    let colorClasses = ['bubble-user-1', 'bubble-user-2', 'bubble-user-3', 'bubble-user-other'];
    let colorIndex = 0;

    function getClientBubbleClass(id) {
      if (!clientColorMap[id]) {
        clientColorMap[id] = colorClasses[colorIndex % colorClasses.length];
        colorIndex++;
      }
      return clientColorMap[id];
    }

    const roomRef = collection(db, "rooms", currentRoom, "messages");
    const q = query(roomRef, orderBy("createdAt", "asc"));

    onSnapshot(q, (snapshot) => {
      const messages = [];
      snapshot.forEach((doc) => {
        messages.push({ id: doc.id, ...doc.data() });
      });
      renderChat(messages);
    });

    async function translateText(text, sourceLang, targetLang) {
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|${targetLang}`);
        const data = await res.json();
        return data.responseData?.translatedText || text;
      } catch (e) {
        console.error("Translation error:", e);
        return text;
      }
    }

    async function sendText() {
      const inputElem = document.getElementById('mainInput');
      const sendBtn = document.getElementById('sendBtn');
      const text = inputElem.value.trim();
      if (!text) return;

      const selectedLang = document.querySelector('input[name="chatLang"]:checked').value;
      const targetLang = selectedLang === 'he' ? 'am' : 'he';
      
      inputElem.value = '';
      sendBtn.disabled = true;

      try {
        const translatedText = await translateText(text, selectedLang, targetLang);
        
        const now = new Date();
        const timeStr = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) + 
                        ' ' + now.toLocaleDateString('he-IL');

        await addDoc(roomRef, {
          original: text,
          translated: translatedText,
          sourceLang: selectedLang,
          clientId: clientId,
          time: timeStr,
          createdAt: serverTimestamp()
        });
      } catch (err) {
        console.error("Error sending message:", err);
      } finally {
        sendBtn.disabled = false;
      }
    }

    async function resetChat() {
      const pwd = prompt("הכנס סיסמה לאיפוס החדר הנוכחי:");
      if (pwd !== "1234") {
        alert("סיסמה שגויה!");
        return;
      }

      try {
        const snapshot = await getDocs(roomRef);
        snapshot.forEach(async (document) => {
          await deleteDoc(doc(db, "rooms", currentRoom, "messages", document.id));
        });
        alert("החדר נוקה בהצלחה.");
      } catch (e) {
        console.error("Error resetting chat:", e);
      }
    }

    function renderChat(history) {
      const chatStream = document.getElementById('chatStream');
      if (!history || history.length === 0) {
        chatStream.innerHTML = '<div class="status-msg">החדר נקי. אפשר להתחיל להקליד...</div>';
        return;
      }

      let html = '';
      history.forEach(msg => {
        const bubbleStyleClass = getClientBubbleClass(msg.clientId);
        const isHebrewSource = (msg.sourceLang === 'he');
        
        if (isHebrewSource) {
          html += `
            <div class="message-bubble ${bubbleStyleClass}">
              <div class="original-text" dir="rtl">🇮🇱 ${escapeHtml(msg.original)}</div>
              <div class="translated-text" dir="ltr">🇪🇹 ${escapeHtml(msg.translated)}</div>
              <div class="msg-time">${msg.time || ''}</div>
            </div>`;
        } else {
          html += `
            <div class="message-bubble ${bubbleStyleClass}">
              <div class="original-text" dir="ltr">🇪🇹 ${escapeHtml(msg.original)}</div>
              <div class="translated-text" dir="rtl">🇮🇱 ${escapeHtml(msg.translated)}</div>
              <div class="msg-time">${msg.time || ''}</div>
            </div>`;
        }
      });

      chatStream.innerHTML = html;
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    document.getElementById('sendBtn').addEventListener('click', sendText);
    document.getElementById('resetBtn').addEventListener('click', resetChat);

    document.getElementById('mainInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendText();
      }
    });

    document.querySelectorAll('input[name="chatLang"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const input = document.getElementById('mainInput');
        if (e.target.value === 'he') {
          input.dir = 'rtl';
          input.placeholder = 'הקלד משפט בעברית...';
        } else {
          input.dir = 'ltr';
          input.placeholder = 'አማርኛ ጽሁፍ እዚህ ይጻፉ...';
        }
      });
    });

    // כפתור מנהל והצגת הפאנל
    document.getElementById('adminBtn').addEventListener('click', async () => {
      const pwd = prompt("הכנס סיסמת מנהל:");
      if (pwd === "1234") {
        document.getElementById('adminBtn').style.display = 'none';
        document.getElementById('newRoomBtn').style.display = 'inline-block';
        document.getElementById('resetBtn').style.display = 'inline-block';
        document.getElementById('adminPanel').style.display = 'block';
        
        loadActiveRooms();
        alert("התחברת כמנהל בהצלחה!");
      } else {
        alert("סיסמה שגויה.");
      }
    });

    // טעינת רשימת החדרים הפעילים מתוך פיירבייס
    async function loadActiveRooms() {
      const listContainer = document.getElementById('activeRoomsList');
      try {
        const querySnapshot = await getDocs(collection(db, "rooms_list"));
        if (querySnapshot.empty) {
          listContainer.innerHTML = '<div style="text-align: center; color: #718096; font-size: 12px;">אין חדרים רשומים במערכת עדיין.</div>';
          return;
        }

        let html = '';
        querySnapshot.forEach((docSnap) => {
          const roomData = docSnap.data();
          html += `
            <div class="room-item">
              <div>
                <a href="?room=${roomData.roomId}" target="_blank">🔗 ${roomData.roomId}</a>
                <span style="font-size: 10px; color: #718096; margin-right: 8px;">(${roomData.createdAt || ''})</span>
              </div>
              <button class="btn-del-room" onclick="window.deleteSystemRoom('${roomData.roomId}')">מחק מרישום</button>
            </div>`;
        });
        listContainer.innerHTML = html;
      } catch (e) {
        console.error("Error loading rooms:", e);
        listContainer.innerHTML = '<div style="color: #e74c3c; font-size: 12px;">שגיאה בטעינת החדרים.</div>';
      }
    }

    // פונקציה גלובלית למחיקת חדר מהרישום
    window.deleteSystemRoom = async function(roomId) {
      if (!confirm(`האם אתה בטוח שברצונך למחוק את החדר ${roomId} מהרישום?`)) return;
      try {
        await deleteDoc(doc(db, "rooms_list", roomId));
        alert("החדר הוסר מהרשימה.");
        loadActiveRooms();
      } catch (e) {
        console.error("Error deleting room:", e);
        alert("שגיאה במחיקת החדר.");
      }
    };

    // יצירת חדר חדש ושמירתו ברישום המרכזי
    document.getElementById('newRoomBtn').addEventListener('click', async () => {
      const randomRoomId = 'room_' + Math.floor(Math.random() * 90000 + 10000);
      const baseUrl = window.location.href.split('?')[0];
      const newRoomUrl = baseUrl + '?room=' + randomRoomId;
      
      const nowStr = new Date().toLocaleDateString('he-IL') + ' ' + new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });

      try {
        // שמירת החדר בקอลקשן המרכזי לניהול
        await setDoc(doc(db, "rooms_list", randomRoomId), {
          roomId: randomRoomId,
          createdAt: nowStr
        });

        loadActiveRooms();

        navigator.clipboard.writeText(newRoomUrl).then(function() {
          prompt("נוצר קישור חדש ונקי! הקישור הועתק ללוח. העבר אותו לתלמיד:", newRoomUrl);
        }, function() {
          prompt("הנה הקישור החדש לשיחה (העתק ידנית):", newRoomUrl);
        });
      } catch (e) {
        console.error("Error saving room to list:", e);
        alert("שגיאה ביצירת החדר בענן.");
      }
    });
  </script>
</body>
</html>
