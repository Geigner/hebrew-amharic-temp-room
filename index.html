<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>גשר שפות עברית אמהרית - היחידה לקידום נוער נוף הגליל</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap');
    body { font-family: 'Assistant', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-emerald-900 text-white shadow-md p-3 sm:p-4 flex flex-wrap justify-between items-center gap-2">
    <div class="flex items-center gap-2">
      <span class="text-xl sm:text-2xl">🌉</span>
      <h1 class="text-base sm:text-xl font-bold">גשר שפות</h1>
    </div>
    
    <div class="flex items-center gap-1.5 flex-wrap">
      <div id="room-indicator" class="text-[11px] sm:text-xs bg-emerald-800 px-2.5 py-1 rounded-full text-emerald-200"></div>
      <button onclick="copyRoomLink()" class="bg-emerald-700 hover:bg-emerald-600 text-[11px] sm:text-xs px-2.5 py-1.5 rounded transition flex items-center gap-1 shadow" title="העתק קישור לחדר הנוכחי לשליחה לתלמיד">
        📋 העתק קישור
      </button>
      <button onclick="createNewRoom()" class="bg-emerald-700 hover:bg-emerald-600 text-[11px] sm:text-xs px-2.5 py-1.5 rounded transition flex items-center gap-1 shadow">
        ➕ חדר חדש
      </button>
      <button onclick="openAdminModal()" class="bg-emerald-800 hover:bg-emerald-700 text-[11px] sm:text-xs px-2.5 py-1.5 rounded transition">
        🔒 מנהל
      </button>
    </div>
  </header>

  <!-- Main Chat Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-2 sm:p-4 flex flex-col gap-3">
    <!-- Chat History Box -->
    <div id="chat-box" class="bg-white border border-slate-200 rounded-xl shadow-inner flex-1 p-3 sm:p-4 overflow-y-auto h-[50vh] sm:max-h-[60vh] sm:min-h-[400px] flex flex-col gap-3">
      <div class="text-center text-slate-400 py-10">טוען היסטוריית שיחה...</div>
    </div>

    <!-- Input Area -->
    <div class="bg-white border border-slate-200 rounded-xl shadow p-3 sm:p-4 flex flex-col gap-2.5">
      <div class="flex items-center justify-between text-xs sm:text-sm text-slate-600 flex-wrap gap-2">
        <div class="flex items-center gap-3">
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="radio" name="sourceLang" value="he" checked class="text-emerald-600 focus:ring-emerald-500">
            <span>עברית 🇮🇱</span>
          </label>
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="radio" name="sourceLang" value="am" class="text-emerald-600 focus:ring-emerald-500">
            <span>אמהרית 🇪🇹</span>
          </label>
        </div>
        <span id="typing-status" class="text-[11px] sm:text-xs text-slate-400">מתחבר...</span>
      </div>

      <div class="flex gap-2">
        <textarea id="message-input" rows="2" placeholder="הקלד משפט בעברית..." class="flex-1 border border-slate-300 rounded-lg p-2.5 sm:p-3 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 resize-none" onkeydown="handleKeyPress(event)"></textarea>
        <button onclick="sendMessage()" id="send-btn" class="bg-emerald-700 hover:bg-emerald-800 text-white px-4 sm:px-6 rounded-lg font-medium transition flex items-center justify-center gap-1.5 shadow text-sm sm:text-base">
          <span>שלח</span>
          <span>🚀</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Admin Password Modal -->
  <div id="admin-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl flex flex-col gap-4">
      <h3 class="text-lg font-bold text-slate-800">פעולות מנהל מערכת</h3>
      <p class="text-sm text-slate-600">הכנס סיסמת מנהל לניקוי חדר השיחה הנוכחי:</p>
      <input type="password" id="admin-password-input" placeholder="סיסמה" class="border border-slate-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      <div class="flex gap-2 justify-end mt-2">
        <button onclick="closeAdminModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm">ביטול</button>
        <button onclick="clearChatAction()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium">נקה חדר</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500 leading-relaxed">
    היחידה לקידום נוער נוף הגליל | תוכנית היל"ה<br>
    © תשפ"ז | גיא אייגנר – מנהל השכלה | פיתוח וניהול פדגוגי
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwBQoupgTQT9R9ECmzqVZU9ceNT3CarEpXPCpXYFX9wqLKUp8YLbUN8QzSsv2UiNFX8gQ/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const currentRoom = urlParams.get('room') || 'general_room';
    
    let clientId = localStorage.getItem('hila_client_id');
    if (!clientId) {
      clientId = 'client_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('hila_client_id', clientId);
    }

    document.getElementById('room-indicator').innerText = `חדר: ${currentRoom}`;

    function createNewRoom() {
      const roomName = prompt("הכנס שם לחדר החדש (לדוגמה: student_name, group_1):");
      if (roomName) {
        const cleanName = roomName.trim().replace(/\s+/g, '_');
        window.location.href = window.location.pathname + '?room=' + encodeURIComponent(cleanName);
      }
    }

    function copyRoomLink() {
      const currentUrl = window.location.href;
      navigator.clipboard.writeText(currentUrl).then(() => {
        alert("קישור לחדר הועתק בהצלחה! שלח אותו כעת לתלמיד.");
      }).catch(err => {
        prompt("העתק את הקישור הבא:", currentUrl);
      });
    }

    document.querySelectorAll('input[name="sourceLang"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const input = document.getElementById('message-input');
        input.placeholder = e.target.value === 'he' ? "הקלד משפט בעברית..." : "הקלד משפט באמהרית...";
      });
    });

    async function callApi(action, payload = {}) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action, roomName: currentRoom, ...payload })
        });
        
        const text = await response.text();
        let resJson;
        try {
          resJson = JSON.parse(text);
        } catch (e) {
          throw new Error("השרת החזיר תשובה שאינה JSON תקין. ודא הרשאות Anyone ב-Deploy.");
        }

        if (resJson.status === 'success') {
          return resJson.data;
        } else {
          throw new Error(resJson.message || "שגיאת שרת");
        }
      } catch (err) {
        console.error("API Error:", err);
        throw err;
      }
    }

    let lastHistoryJson = "";

    async function fetchHistory() {
      try {
        const history = await callApi('getHistory');
        const historyJson = JSON.stringify(history);
        
        if (historyJson !== lastHistoryJson) {
          renderChat(history);
          lastHistoryJson = historyJson;
        }
        document.getElementById('typing-status').innerText = "מחובר 🟢";
      } catch (err) {
        document.getElementById('typing-status').innerText = "שגיאת חיבור 🔴";
      }
    }

    function renderChat(history) {
      const chatBox = document.getElementById('chat-box');
      if (!history || history.length === 0) {
        chatBox.innerHTML = `<div class="text-center text-slate-400 py-10">החדר ריק עדיין. התחל לכתוב למטה!</div>`;
        return;
      }

      let html = '';
      history.forEach(item => {
        const isMe = item.clientId === clientId;
        html += `
          <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} gap-1">
            <div class="max-w-xl bg-slate-100 border border-slate-200 rounded-2xl p-3 sm:p-3.5 shadow-sm flex flex-col gap-1.5">
              <div class="text-sm sm:text-base text-slate-900 font-medium">${escapeHtml(item.original)}</div>
              <div class="border-t border-slate-200 pt-1.5 text-sm sm:text-base text-emerald-800 font-semibold" dir="${item.sourceLang === 'he' ? 'ltr' : 'rtl'}">
                ${escapeHtml(item.translated)}
              </div>
            </div>
            <span class="text-[10px] text-slate-400 px-1">${item.time}</span>
          </div>
        `;
      });

      const isAtBottom = chatBox.scrollHeight - chatBox.scrollTop <= chatBox.clientHeight + 50;
      chatBox.innerHTML = html;
      if (isAtBottom) {
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      const sourceLang = document.querySelector('input[name="sourceLang"]:checked').value;
      input.value = '';
      document.getElementById('send-btn').disabled = true;

      try {
        const history = await callApi('sendMessage', { text, sourceLang, clientId });
        renderChat(history);
        lastHistoryJson = JSON.stringify(history);
      } catch (err) {
        alert("שגיאה בשליחת ההודעה: " + err.message);
      } finally {
        document.getElementById('send-btn').disabled = false;
        input.focus();
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function openAdminModal() {
      document.getElementById('admin-modal').classList.remove('hidden');
      document.getElementById('admin-password-input').value = '';
      document.getElementById('admin-password-input').focus();
    }

    function closeAdminModal() {
      document.getElementById('admin-modal').classList.add('hidden');
    }

    async function clearChatAction() {
      const password = document.getElementById('admin-password-input').value;
      if (!password) {
        alert("נא להזין סיסמה");
        return;
      }

      try {
        const history = await callApi('clearChat', { password });
        renderChat(history);
        lastHistoryJson = JSON.stringify(history);
        closeAdminModal();
        alert("החדר נוקה בהצלחה.");
      } catch (err) {
        alert("שגיאה: " + err.message);
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    fetchHistory();
    setInterval(fetchHistory, 2000);
  </script>
</body>
</html>
