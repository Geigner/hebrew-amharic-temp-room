<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>גשר שפות עברית אמהרית - היחידה לקידום נוער נוף הגליל</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #efeae2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111b21;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      height: 100%;
      height: 100dvh;
      margin: 0 auto;
      background: #ffffff;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
    }
    .header-title {
      background-color: #005c4b;
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .admin-controls {
      display: flex;
      gap: 6px;
    }
    .btn-admin, .btn-new-room, .btn-reset {
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 13px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }
    .btn-admin { background-color: #3b4a54; }
    .btn-new-room { background-color: #00a884; display: none; }
    .btn-reset { background-color: #ea0038; display: none; }

    .chat-stream {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #d1d7db;
      border-radius: 8px;
      padding: 12px;
      background: #efeae2;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .message-bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.4;
      box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
      word-break: break-word;
      position: relative;
    }
    .bubble-user-1 {
      align-self: flex-start;
      background-color: #ffffff;
      border-right: 4px solid #005c4b;
    }
    .bubble-user-2 {
      align-self: flex-end;
      background-color: #d9fdd3;
      border-left: 4px solid #25d366;
    }
    .bubble-user-3 {
      align-self: flex-start;
      background-color: #f0f2f5;
      border-right: 4px solid #54656f;
    }
    .bubble-user-other {
      align-self: flex-end;
      background-color: #e7ffdb;
      border-left: 4px solid #128c7e;
    }

    .original-text { font-weight: 700; margin-bottom: 4px; font-size: 17px; }
    .translated-text { color: #3b4a54; font-size: 16px; border-top: 1px dashed #d1d7db; padding-top: 6px; margin-top: 6px; }
    .msg-time { font-size: 11px; color: #667781; text-align: left; margin-top: 4px; }
    
    .input-section {
      background: #f0f2f5;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d1d7db;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .lang-selector {
      font-size: 15px;
      font-weight: bold;
      color: #005c4b;
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .lang-selector label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lang-selector input[type="radio"] {
      transform: scale(1.3);
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    textarea {
      flex: 1;
      height: 50px;
      padding: 10px 12px;
      border: 1px solid #d1d7db;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      resize: none;
      background: #ffffff;
    }
    textarea:focus { border-color: #00a884; outline: none; }
    .btn-send {
      background-color: #00a884;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    footer {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #d1d7db;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #54656f;
      flex-wrap: wrap;
      gap: 4px;
    }

    /* התאמה מלאה למובייל במסך מלא בגיטהב */
    @media screen and (max-width: 768px) {
      .container {
        width: 100vw;
        max-width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: 0;
        box-shadow: none;
        border-radius: 0;
      }
      .header-title {
        border-radius: 0;
        margin-bottom: 0;
      }
      .chat-stream {
        border-radius: 0;
        border: none;
        margin-bottom: 0;
      }
      .input-section {
        border-radius: 0;
        border: none;
        border-top: 1px solid #d1d7db;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">
      <span id="roomTitle">🗣️ גשר שפות – חדר שיחה</span>
      <div class="admin-controls">
        <button id="adminBtn" class="btn-admin" onclick="unlockAdmin()">🔐 מנהל</button>
        <button id="newRoomBtn" class="btn-new-room" onclick="createNewRoomLink()">🔗 צור קישור</button>
        <button id="resetBtn" class="btn-reset" onclick="resetChat()">🗑️ נקה</button>
      </div>
    </div>

    <div id="chatStream" class="chat-stream">
      <div style="text-align: center; color: #667781; font-size: 16px; margin-top: 35px;">
        טוען שיחה רגעית...
      </div>
    </div>

    <div class="input-section">
      <div class="input-controls">
        <div class="lang-selector">
          <span>שפת הקלדה:</span>
          <label><input type="radio" name="chatLang" value="he" checked onclick="setLang('he')"> 🇮🇱 עברית</label>
          <label><input type="radio" name="chatLang" value="am" onclick="setLang('am')"> 🇪🇹 አማርኛ</label>
        </div>
      </div>
      <div class="input-row">
        <textarea id="mainInput" placeholder="הקלד משפט בעברית..." dir="rtl" onkeydown="checkSubmit(event)"></textarea>
        <button class="btn-send" onclick="sendText()">שלח 🚀</button>
      </div>
    </div>

    <footer>
      <div>היחידה לקידום נוער נוף הגליל | תוכנית היל"ה</div>
      <div>© תשפ"ז | גיא אייגנר – מנהל השכלה | פיתוח וניהול פדגוגי</div>
    </footer>
  </div>

  <script>
    // כתובת ה-API המעודכנת מתוך Google Apps Script שלך
    const API_URL = "https://script.google.com/macros/s/AKfycbxZQh2hQQqSkVfSTstpfC_3lov6PohdH2VAwvZGeSxneyr0NFTRJmGFHOGxkzmmwq2K5w/exec";

    const urlParams = new URLSearchParams(window.location.search);
    let currentRoom = urlParams.get('room');
    
    if (!currentRoom) {
      currentRoom = 'general_room';
    } else {
      document.getElementById('roomTitle').innerText = '🗣️ חדר: ' + currentRoom;
    }

    let clientId = localStorage.getItem('hila_client_id_am');
    if (!clientId) {
      clientId = 'client_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('hila_client_id_am', clientId);
    }

    let clientColorMap = {};
    let colorClasses = ['bubble-user-1', 'bubble-user-2', 'bubble-user-3', 'bubble-user-other'];
    let colorIndex = 0;

    function getClientBubbleClass(id) {
      if (!clientColorMap[id]) {
        clientColorMap[id] = colorClasses[colorIndex % colorClasses.length];
        colorIndex++;
      }
      return clientColorMap[id];
    }

    setInterval(loadHistory, 2000);
    window.onload = function() {
      loadHistory();
    };

    function setLang(lang) {
      const input = document.getElementById('mainInput');
      if (lang === 'he') {
        input.dir = 'rtl';
        input.placeholder = 'הקלד משפט בעברית...';
      } else {
        input.dir = 'ltr';
        input.placeholder = 'ጽሁፍ እዚህ ይፃፉ...';
      }
    }

    async function callApi(action, payload = {}) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action, roomName: currentRoom, ...payload })
        });
        const resJson = await response.json();
        if (resJson.status === 'success') {
          return resJson.data;
        } else {
          throw new Error(resJson.message);
        }
      } catch (err) {
        console.error("API Error:", err);
        throw err;
      }
    }

    async function loadHistory() {
      try {
        const history = await callApi('getHistory');
        renderChat(history);
      } catch (e) {
        // התעלמות משגיאות שליפה מחזוריות ברקע למניעת קפיצות
      }
    }

    function checkSubmit(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendText();
      }
    }

    async function sendText() {
      const inputElem = document.getElementById('mainInput');
      const text = inputElem.value.trim();
      if (!text) return;

      const selectedLang = document.querySelector('input[name="chatLang"]:checked').value;
      inputElem.value = '';

      try {
        const history = await callApi('sendMessage', { text, sourceLang: selectedLang, clientId });
        renderChat(history);
      } catch (err) {
        alert("שגיאה בשליחה: " + err.message);
      }
    }

    async function unlockAdmin() {
      const pwd = prompt("הכנס סיסמת מנהל:");
      if (!pwd) return;

      try {
        const isValid = await callApi('verifyAdmin', { password: pwd });
        if (isValid) {
          document.getElementById('adminBtn').style.display = 'none';
          document.getElementById('newRoomBtn').style.display = 'inline-block';
          document.getElementById('resetBtn').style.display = 'inline-block';
          alert("התחברת כמנהל בהצלחה!");
        } else {
          alert("סיסמה שגויה.");
        }
      } catch (err) {
        alert("שגיאה באימות: " + err.message);
      }
    }

    function createNewRoomLink() {
      const randomRoomId = 'room_' + Math.floor(Math.random() * 90000 + 10000);
      const baseUrl = window.location.href.split('?')[0];
      const newRoomUrl = baseUrl + '?room=' + randomRoomId;
      
      navigator.clipboard.writeText(newRoomUrl).then(function() {
        prompt("נוצר קישור חדש ונקי לשיחה! הקישור הועתק ללוח. העבר אותו לתלמיד בוואטסאפ:", newRoomUrl);
      }, function() {
        prompt("הנה הקישור החדש לשיחה (העתק ידנית):", newRoomUrl);
      });
    }

    async function resetChat() {
      const pwd = prompt("הכנס סיסמה לאיפוס החדר הרגעי:");
      if (!pwd) return;

      try {
        const history = await callApi('clearChat', { password: pwd });
        renderChat(history);
        alert("החדר נוקה בהצלחה.");
      } catch (err) {
        alert("שגיאה באיפוס: " + err.message);
      }
    }

    function renderChat(history) {
      const chatStream = document.getElementById('chatStream');
      if (!history || history.length === 0) {
        chatStream.innerHTML = '<div style="text-align: center; color: #667781; font-size: 16px; margin-top: 35px;">החדר נקי. אפשר להתחיל להקליד...</div>';
        return;
      }

      let html = '';
      history.forEach(msg => {
        const bubbleStyleClass = getClientBubbleClass(msg.clientId);
        const isHebrewSource = (msg.sourceLang === 'he');
        
        if (isHebrewSource) {
          html += `
            <div class="message-bubble ${bubbleStyleClass}">
              <div class="original-text" dir="rtl">🇮🇱 ${escapeHtml(msg.original)}</div>
              <div class="translated-text" dir="ltr">🇪🇹 ${escapeHtml(msg.translated)}</div>
              <div class="msg-time">${msg.time}</div>
            </div>`;
        } else {
          html += `
            <div class="message-bubble ${bubbleStyleClass}">
              <div class="original-text" dir="ltr">🇪🇹 ${escapeHtml(msg.original)}</div>
              <div class="translated-text" dir="rtl">🇮🇱 ${escapeHtml(msg.translated)}</div>
              <div class="msg-time">${msg.time}</div>
            </div>`;
        }
      });

      const isScrolledToBottom = chatStream.scrollHeight - chatStream.clientHeight <= chatStream.scrollTop + 30;
      chatStream.innerHTML = html;
      if (isScrolledToBottom) {
        chatStream.scrollTop = chatStream.scrollHeight;
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
