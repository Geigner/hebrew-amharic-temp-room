<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>גשר שפות: עברית-אמהרית | היחידה לקידום נוער נוף הגליל</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col justify-between font-sans">

  <!-- כותרת עליונה -->
  <header class="bg-indigo-700 text-white shadow-md p-4 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold">גשר שפות: עברית ⇄ אמהרית</h1>
      <p class="text-xs text-indigo-200">תוכנית היל"ה | נוף הגליל</p>
    </div>
    <button onclick="resetChatPrompt()" class="bg-indigo-800 hover:bg-indigo-900 text-xs px-3 py-1.5 rounded transition">
      איפוס חדר
    </button>
  </header>

  <!-- אזור גלילת הודעות -->
  <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
    <!-- הודעות יטענו כאן דינמית -->
  </main>

  <!-- אזור הקלדה מהיר מעוגן בתחתית -->
  <footer class="bg-white border-t border-slate-200 p-3 shadow-lg">
    <form id="chatForm" onsubmit="sendMessage(event)" class="flex flex-col sm:flex-row gap-2 max-w-4xl mx-auto">
      <div class="flex gap-2">
        <select id="msgLang" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-medium">
          <option value="he">עברית ➔ אמהרית</option>
          <option value="am">אמהרית ➔ עברית</option>
        </select>
      </div>
      <div class="flex-1 flex gap-2">
        <input type="text" id="msgText" placeholder="הקלד הודעה ולחץ Enter..." class="flex-1 border border-slate-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required autofocus>
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
          שליחה
        </button>
      </div>
    </form>
    
    <!-- חתימה פדגוגית קבועה -->
    <div class="text-center text-[10px] text-slate-400 mt-2 border-t border-slate-100 pt-1">
      היחידה לקידום נוער נוף הגליל | תוכנית היל"ה<br>
      © תשפ"ז | גיא אייגנר – מנהל השכלה | פיתוח וניהול פדגוגי
    </div>
  </footer>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyi9xbQ7LQOq0g05ZrBr9rZkoSDXhLcVOaT-thgXry50lxMF3CghDHZE_FZvjboJcAU/exec';
    let lastMessagesSignature = '';

    async function fetchMessages() {
      try {
        const response = await fetch(`${WEB_APP_URL}?action=getMessages`);
        const messages = await response.json();
        
        const signature = JSON.stringify(messages);
        if (signature !== lastMessagesSignature) {
          lastMessagesSignature = signature;
          renderMessages(messages);
        }
      } catch (err) {
        console.error('שגיאה בטעינת הודעות:', err);
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';
      
      if (messages.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-400 my-auto text-sm">אין הודעות בחדר כרגע. התחל שיחה חדשה!</div>`;
        return;
      }

      messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = `flex flex-col max-w-[85%] sm:max-w-[70%] rounded-2xl p-3 shadow-sm bg-white border border-slate-200`;
        
        div.innerHTML = `
          <div class="flex justify-between items-center mb-1 text-xs text-slate-400 border-b pb-1">
            <span>מערכת גשר שפות</span>
            <span>${msg.timestamp}</span>
          </div>
          <div class="text-sm text-slate-800 font-medium py-1" dir="rtl">עברית: ${escapeHtml(msg.he)}</div>
          <div class="text-sm text-indigo-600 font-medium py-1 border-t border-dashed border-slate-100" dir="ltr">አማርኛ: ${escapeHtml(msg.am)}</div>
        `;
        container.appendChild(div);
      });
      
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(e) {
      if (e) e.preventDefault();
      const text = document.getElementById('msgText').value;
      const lang = document.getElementById('msgLang').value;
      
      if (!text.trim()) return;
      document.getElementById('msgText').value = '';

      try {
        await fetch(`${WEB_APP_URL}?action=sendMessage&text=${encodeURIComponent(text)}&lang=${lang}`);
        fetchMessages();
      } catch (err) {
        console.error('שגיאה בשליחת הודעה:', err);
      }
    }

    // תמיכה מלאה במקש Enter לשליחה מהירה
    document.getElementById('msgText').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function resetChatPrompt() {
      const pwd = prompt('הכנס סיסמת מנהל לאיפוס החדר:');
      if (!pwd) return;
      
      try {
        const res = await fetch(`${WEB_APP_URL}?action=resetChat&pwd=${encodeURIComponent(pwd)}`);
        const result = await res.json();
        if (result.status === 'success') {
          alert('החדר אופס בהצלחה.');
          fetchMessages();
        } else {
          alert('שגיאה: ' + result.message);
        }
      } catch (err) {
        alert('שגיאה בתקשורת מול השרת.');
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    setInterval(fetchMessages, 3000);
    fetchMessages();
  </script>
</body>
</html>
