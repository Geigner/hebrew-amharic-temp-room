<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>גשר שפות עברית אמהרית - היחידה לקידום נוער נוף הגליל</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap');
    body { font-family: 'Assistant', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-emerald-900 text-white shadow-md p-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🌉</span>
      <h1 class="text-xl font-bold">גשר שפות – חדר שיחה</h1>
    </div>
    <div id="room-indicator" class="text-xs bg-emerald-800 px-3 py-1 rounded-full text-emerald-200"></div>
    <button onclick="openAdminModal()" class="bg-emerald-800 hover:bg-emerald-700 text-xs px-3 py-1.5 rounded transition flex items-center gap-1">
      🔒 מנהל
    </button>
  </header>

  <!-- Main Chat Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-4">
    <!-- Chat History Box -->
    <div id="chat-box" class="bg-white border border-slate-200 rounded-xl shadow-inner flex-1 p-4 overflow-y-auto max-h-[60vh] min-h-[400px] flex flex-col gap-3">
      <!-- הודעות יטענו לכאן אוטומטית -->
      <div class="text-center text-slate-400 py-10">טוען היסטוריית שיחה...</div>
    </div>

    <!-- Input Area -->
    <div class="bg-white border border-slate-200 rounded-xl shadow p-4 flex flex-col gap-3">
      <div class="flex items-center justify-between text-sm text-slate-600">
        <div class="flex items-center gap-4">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="radio" name="sourceLang" value="he" checked class="text-emerald-600 focus:ring-emerald-500">
            <span>שפת הקלדה: עברית 🇮🇱</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="radio" name="sourceLang" value="am" class="text-emerald-600 focus:ring-emerald-500">
            <span>שפת הקלדה: אמהרית 🇪🇹</span>
          </label>
        </div>
        <span id="typing-status" class="text-xs text-slate-400">מתחבר לשרת...</span>
      </div>

      <div class="flex gap-2">
        <textarea id="message-input" rows="2" placeholder="הקלד משפט בעברית..." class="flex-1 border border-slate-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 resize-none" onkeydown="handleKeyPress(event)"></textarea>
        <button onclick="sendMessage()" id="send-btn" class="bg-emerald-700 hover:bg-emerald-800 text-white px-6 rounded-lg font-medium transition flex items-center justify-center gap-2 shadow">
          <span>שלح</span>
          <span>🚀</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Admin Password Modal -->
  <div id="admin-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl flex flex-col gap-4">
      <h3 class="text-lg font-bold text-slate-800">פעולות מנהל מערכת</h3>
      <p class="text-sm text-slate-600">הכנס סיסמת מנהל לניקוי חדר השיחה הנוכחי:</p>
      <input type="password" id="admin-password-input" placeholder="סיסמה" class="border border-slate-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      <div class="flex gap-2 justify-end mt-2">
        <button onclick="closeAdminModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm">ביטול</button>
        <button onclick="clearChatAction()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium">נקה חדר</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
    היחידה לקידום נוער נוף הגליל | תוכנית היל"ה<br>
    © תשפ"ז | גיא אייגנר – מנהל השכלה | פיתוח וניהול פדגוגי
  </footer>

  <script>
    // כתובת ה-API של ה-Apps Script (ודא מעודכן לכתובת הפריסה האחרונה)
    const API_URL = "כאן_הכנס_את_כתובת_הווב_אפ_שלך_מגוגל";

    // זיהוי שם החדר מתוך פרמטר ב-URL (למשל ?room=room_123)
    const urlParams = new URLSearchParams(window.location.search);
    const currentRoom = urlParams.get('room') || 'general_room';
    
    // מזהה מכשיר ייחודי למניעת כפילויות תצוגה
    let clientId = localStorage.getItem('hila_client_id');
    if (!clientId) {
      clientId = 'client_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('hila_client_id', clientId);
    }

    document.getElementById('room-indicator').innerText = `חדר: ${currentRoom}`;

    // עדכון מקלדת / פלייסהולדר לפי בחירת השפה
    document.querySelectorAll('input[name="sourceLang"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const input = document.getElementById('message-input');
        if (e.target.value === 'he') {
          input.placeholder = "הקלד משפט בעברית...";
        } else {
          input.placeholder = "הקלד משפט באמהרית...";
        }
      });
    });

    async function callApi(action, payload = {}) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action, roomName: currentRoom, ...payload })
        });
        
        const rawText = await response.text();
        let resJson;
        try {
          resJson = JSON.parse(rawText);
        } catch (parseErr) {
          console.error("Server returned non-JSON:", rawText);
          throw new Error("השרת החזיר תשובה שאינה תקינה. ודא שביצעת Deploy חדש ב-Apps Script.");
        }

        if (resJson.status === 'success') {
          return resJson.data;
        } else {
          throw new Error(resJson.message || "שגיאה לא ידועה מהשרת");
        }
      } catch (err) {
        console.error("API Error:", err);
        throw err;
      }
    }

    let lastHistoryLength = -1;

    async function fetchHistory(isBackground = false) {
      try {
        const history = await callApi('getHistory');
        
        // עדכון רק אם יש שינוי באורכו כדי למנוע ריצוד מסך מיותר
        if (history.length !== lastHistoryLength) {
          renderChat(history);
          lastHistoryLength = history.length;
        }
        
        document.getElementById('typing-status').innerText = "מחובר בזמן אמת 🟢";
      } catch (err) {
        document.getElementById('typing-status').innerText = "שגיאת חיבור 🔴";
      }
    }

    function renderChat(history) {
      const chatBox = document.getElementById('chat-box');
      if (!history || history.length === 0) {
        chatBox.innerHTML = `<div class="text-center text-slate-400 py-10">החדר ריק עדיין. התחל לכתוב למטה!</div>`;
        return;
      }

      let html = '';
      history.forEach(item => {
        const isMe = item.clientId === clientId;
        html += `
          <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} gap-1">
            <div class="max-w-xl bg-slate-100 border border-slate-200 rounded-2xl p-3.5 shadow-sm flex flex-col gap-2">
              <div class="text-base text-slate-900 font-medium">${escapeHtml(item.original)}</div>
              <div class="border-t border-slate-200 pt-1.5 text-base text-emerald-800 font-semibold" dir="${item.sourceLang === 'he' ? 'ltr' : 'rtl'}">
                ${escapeHtml(item.translated)}
              </div>
            </div>
            <span class="text-[10px] text-slate-400 px-1">${item.time}</span>
          </div>
        `;
      });

      // שמירה על מיקום הגלילה אם המשתמש כבר נמצא למטה
      const isAtBottom = chatBox.scrollHeight - chatBox.scrollTop <= chatBox.clientHeight + 50;
      chatBox.innerHTML = html;
      if (isAtBottom || lastHistoryLength === -1) {
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      const sourceLang = document.querySelector('input[name="sourceLang"]:checked').value;
      input.value = '';
      document.getElementById('send-btn').disabled = true;

      try {
        const history = await callApi('sendMessage', { text, sourceLang, clientId });
        renderChat(history);
        lastHistoryLength = history.length;
      } catch (err) {
        alert("שגיאה בשליחת ההודעה: " + err.message);
      } finally {
        document.getElementById('send-btn').disabled = false;
        input.focus();
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function openAdminModal() {
      document.getElementById('admin-modal').classList.remove('hidden');
      document.getElementById('admin-password-input').value = '';
      document.getElementById('admin-password-input').focus();
    }

    function closeAdminModal() {
      document.getElementById('admin-modal').classList.add('hidden');
    }

    async function clearChatAction() {
      const password = document.getElementById('admin-password-input').value;
      if (!password) {
        alert("נא להזין סיסמה");
        return;
      }

      try {
        const history = await callApi('clearChat', { password });
        renderChat(history);
        lastHistoryLength = 0;
        closeAdminModal();
        alert("החדר נוקה בהצלחה.");
      } catch (err) {
        alert("שגיאה: " + err.message);
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // טעינה ראשונית ופולינג כל 2 שניות
    fetchHistory();
    setInterval(() => fetchHistory(true), 2000);
  </script>
</body>
</html>
